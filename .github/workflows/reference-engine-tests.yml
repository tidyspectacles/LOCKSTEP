name: Reference engine tests

on:
  push:
    paths:
      - "engine/**"
      - ".github/workflows/reference-engine-tests.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/reference-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline reference tests
        working-directory: engine
        run: python -m unittest -v
